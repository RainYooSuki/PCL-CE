name: Auto Release

run-name: Auto release ${{ github.ref_name }}

# 每次向 dev 分支推送提交后：
# 1. 读取 VERSION（YYYY.MM.N 或 YYYY.MM.N.<7位SHA>）
# 2. 生成 YYYY.MM.N.<当前提交短SHA>
# 3. 将版本号注入构建产物元数据，构建、打包并发布正式 Release
# 4. 将新的版本号写回 VERSION 并提交
#
# VERSION 中的 N 在当月内递增；跨月后自动从 1 开始。
# 如需让所有分支都自动发布，可将 branches 改为 ['**']。
on:
  push:
    branches:
      - dev
    # 仅版本文件变化时无需再次发布。
    paths-ignore:
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# 发布流程会提交 VERSION，因此同一分支的发布需要串行执行。
concurrency:
  group: auto-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Compute release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"

          if [[ ! -f VERSION ]]; then
            echo "VERSION file not found" >&2
            exit 1
          fi

          version_raw=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
            version_raw="$(git show "origin/${GITHUB_REF_NAME}:VERSION" 2>/dev/null || true)"
          fi
          if [[ -z "${version_raw}" ]]; then
            version_raw="$(cat VERSION)"
          fi
          version_raw="$(printf '%s' "${version_raw}" | tr -d '[:space:]')"

          if [[ ! "${version_raw}" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]+)(\.[0-9a-fA-F]{7})?$ ]]; then
            echo "Invalid VERSION format: ${version_raw}" >&2
            echo "Expected: YYYY.MM.N or YYYY.MM.N.<7-char-sha>" >&2
            exit 1
          fi

          file_year="${BASH_REMATCH[1]}"
          file_month="${BASH_REMATCH[2]}"
          file_sequence="${BASH_REMATCH[3]}"

          current_year="$(TZ=Asia/Shanghai date +%Y)"
          current_month="$(TZ=Asia/Shanghai date +%m)"

          if [[ "${file_year}" == "${current_year}" && "${file_month}" == "${current_month}" ]]; then
            sequence=$((10#${file_sequence} + 1))
          else
            sequence=1
          fi

          release_version="${current_year}.${current_month}.${sequence}.${short_sha}"

          {
            echo "short_sha=${short_sha}"
            echo "release_version=${release_version}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.architecture }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
          - architecture: ARM64
    env:
      LANG: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build Project
        env:
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_GITHUB_SHA: ${{ github.sha }}
          PCL_RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -p:Configuration=Release -p:Platform=${{ matrix.architecture }} \
            -p:DeleteExistingFiles=true -o ./artifact --no-self-contained

      - name: Upload the Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL2_CE_Release_${{ matrix.architecture }}
          path: artifact/**
          if-no-files-found: error

  publish:
    name: Package and publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download x64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL2_CE_Release_x64
          path: artifacts/x64

      - name: Download ARM64 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL2_CE_Release_ARM64
          path: artifacts/ARM64

      - name: Package release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail

          mkdir -p dist package/x64 package/ARM64

          x64_source="$(find artifacts/x64 -maxdepth 1 -type f -name '*.exe' -print -quit)"
          arm64_source="$(find artifacts/ARM64 -maxdepth 1 -type f -name '*.exe' -print -quit)"

          if [[ -z "${x64_source}" || -z "${arm64_source}" ]]; then
            echo "Build artifact is missing an .exe file" >&2
            find artifacts -maxdepth 3 -type f -print >&2
            exit 1
          fi

          x64_name="PCL2_CE_${RELEASE_VERSION}_x64.exe"
          arm64_name="PCL2_CE_${RELEASE_VERSION}_ARM64.exe"

          mv "${x64_source}" "dist/${x64_name}"
          mv "${arm64_source}" "dist/${arm64_name}"

          cp "dist/${x64_name}" "package/x64/${x64_name}"
          cp "dist/${arm64_name}" "package/ARM64/${arm64_name}"

          write_build_info() {
            local platform="$1"
            cat > "package/${platform}/BUILD_INFO.txt" <<EOF
          PCL2 CE release
          Version: ${RELEASE_VERSION}
          Commit: ${GITHUB_SHA}
          Branch: ${GITHUB_REF_NAME}
          Platform: ${platform}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          }

          write_build_info x64
          write_build_info ARM64

          x64_zip="PCL2_CE_${RELEASE_VERSION}_x64.zip"
          arm64_zip="PCL2_CE_${RELEASE_VERSION}_ARM64.zip"
          x64_checksum="PCL2_CE_${RELEASE_VERSION}_x64.sha256"
          arm64_checksum="PCL2_CE_${RELEASE_VERSION}_ARM64.sha256"

          (cd package/x64 && zip -r "../../dist/${x64_zip}" .)
          (cd package/ARM64 && zip -r "../../dist/${arm64_zip}" .)

          (
            cd dist
            sha256sum "${x64_name}" "${x64_zip}" > "${x64_checksum}"
            sha256sum "${arm64_name}" "${arm64_zip}" > "${arm64_checksum}"
          )

      - name: Create release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          previous_tag="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
            --json tagName,isDraft,createdAt \
            | jq -r --arg current "${RELEASE_VERSION}" \
              'map(select(.isDraft == false and .tagName != $current)) | sort_by(.createdAt) | reverse | .[0].tagName // empty')"

          if [[ -n "${previous_tag}" ]] && git rev-parse -q --verify "refs/tags/${previous_tag}^{commit}" >/dev/null; then
            log_targets=("${previous_tag}..HEAD")
          else
            previous_tag=""
            log_targets=("HEAD")
          fi

          commits="$(git log "${log_targets[@]}" \
            --invert-grep --grep='^chore(release):' \
            --pretty=format:'%h|%H|%s')"

          if [[ -n "${previous_tag}" ]]; then
            printf '## Changes since `%s`\n\n' "${previous_tag}" > release-notes.md
          else
            printf '## Changes\n\n' > release-notes.md
          fi

          if [[ -z "${commits}" ]]; then
            printf -- '- No commits since the previous release.\n' >> release-notes.md
          else
            while IFS='|' read -r short_hash full_hash subject; do
              printf -- '- [`%s`](%s/%s/commit/%s) %s\n' \
                "${short_hash}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${full_hash}" "${subject}"
            done <<< "${commits}" >> release-notes.md
          fi

          {
            echo
            echo "## Build"
            echo
            printf -- '- Version: `%s`\n' "${RELEASE_VERSION}"
            printf -- '- Source commit: [`%s`](%s/%s/commit/%s)\n' \
              "${SHORT_SHA}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
            echo "- Platforms: x64, ARM64"
            printf -- '- Workflow run: [%s](%s/%s/actions/runs/%s)\n' \
              "${GITHUB_RUN_ID}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
          } >> release-notes.md

      - name: Upload packaged assets as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL2_CE_${{ needs.prepare.outputs.release_version }}_all
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: PCL2 CE ${{ needs.prepare.outputs.release_version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: 'true'
          fail_on_unmatched_files: true
          files: |
            dist/PCL2_CE_${{ needs.prepare.outputs.release_version }}_x64.exe
            dist/PCL2_CE_${{ needs.prepare.outputs.release_version }}_ARM64.exe
            dist/PCL2_CE_${{ needs.prepare.outputs.release_version }}_x64.zip
            dist/PCL2_CE_${{ needs.prepare.outputs.release_version }}_ARM64.zip
            dist/PCL2_CE_${{ needs.prepare.outputs.release_version }}_x64.sha256
            dist/PCL2_CE_${{ needs.prepare.outputs.release_version }}_ARM64.sha256

      - name: Commit next version
        if: github.ref_type == 'branch'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          git checkout -B "${branch}" "origin/${branch}"

          printf '%s\n' "${RELEASE_VERSION}" > VERSION
          git add VERSION

          if git diff --cached --quiet; then
            echo "VERSION is already up to date."
            exit 0
          fi

          git commit -m "chore(release): ${RELEASE_VERSION}"
          git push origin "HEAD:${branch}"